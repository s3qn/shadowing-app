# iOS build on a GitHub macOS runner, then submit to TestFlight.
# Builds locally on the runner (eas build --local), so it uses no EAS cloud
# build minutes. Needs the EXPO_TOKEN repository secret (an Expo access token
# for the account that owns the project). Start it with:
#   gh workflow run ios-build.yml -f ref=<commit or branch>
# or by pushing a tag: git tag ios-<name> <commit> && git push origin ios-<name>
name: iOS build

on:
  push:
    tags: ['ios-*']
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, tag or branch to build
        required: true
        default: main
      submit:
        description: Submit to TestFlight after the build
        type: boolean
        default: true

concurrency:
  group: ios-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Use the newest Xcode on the runner
        run: |
          ls -d /Applications/Xcode*.app
          NEWEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version
          pod --version || true
          fastlane --version || true

      - name: Check the Expo login
        run: npx --yes eas-cli@latest whoami

      - name: Install dependencies
        run: npm ci

      - name: Build the iOS app on this runner
        run: |
          set -o pipefail
          npx --yes eas-cli@latest build --platform ios --profile production --local --non-interactive --output "$RUNNER_TEMP/app.ipa" 2>&1 | tee "$RUNNER_TEMP/build.log" || {
            # Annotations are readable without a login, so the error tail lands there.
            TAIL=$(grep -iE "error|fail|❌|exception" "$RUNNER_TEMP/build.log" | tail -n 25; echo "--- last lines ---"; tail -n 35 "$RUNNER_TEMP/build.log")
            TAIL="${TAIL//'%'/'%25'}"; TAIL="${TAIL//$'\n'/'%0A'}"; TAIL="${TAIL//$'\r'/'%0D'}"
            echo "::error title=iOS build failed::${TAIL}"
            exit 1
          }

      - name: Submit to TestFlight
        if: ${{ github.event_name == 'push' || inputs.submit }}
        run: npx --yes eas-cli@latest submit --platform ios --profile production --path "$RUNNER_TEMP/app.ipa" --non-interactive
