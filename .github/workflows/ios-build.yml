# iOS build on a GitHub macOS runner, then submit to TestFlight.
# Builds locally on the runner (eas build --local), so it uses no EAS cloud
# build minutes. Needs the EXPO_TOKEN repository secret (an Expo access token
# for the account that owns the project). Start it with:
#   gh workflow run ios-build.yml -f ref=<commit or branch>
name: iOS build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, tag or branch to build
        required: true
        default: main
      submit:
        description: Submit to TestFlight after the build
        type: boolean
        default: true

concurrency:
  group: ios-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the iOS app on this runner
        run: npx --yes eas-cli@latest build --platform ios --profile production --local --non-interactive --output "$RUNNER_TEMP/app.ipa"

      - name: Submit to TestFlight
        if: ${{ inputs.submit }}
        run: npx --yes eas-cli@latest submit --platform ios --profile production --path "$RUNNER_TEMP/app.ipa" --non-interactive
